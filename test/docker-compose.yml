services:
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: ssm,sts,s3,kms,cloudformation,iam
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-imds:
    build:
      context: ../
      dockerfile: cmd/mock-imds/Dockerfile
    ports:
      - "1338:1338"
    environment:
      LISTEN_ADDR: ":1338"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1338/latest/api/token || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Full QEMU enclave test runner (replaces nix develop).
  # Usage: docker compose --profile test run --build test-runner
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.runner
    privileged: true
    network_mode: host
    volumes:
      - .:/test
    depends_on:
      localstack:
        condition: service_healthy
      mock-imds:
        condition: service_healthy
    environment:
      SKIP_MOCK_SERVICES: "1"
      # Must match enclave.yaml name — the SDK reads ENCLAVE_APP_NAME for SSM paths.
      ENCLAVE_APP_NAME: "test-app"
    command: ["./run.sh", "app/enclave/artifacts/image.eif"]
