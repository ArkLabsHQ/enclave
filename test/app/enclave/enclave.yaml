# Enclave configuration
# Edit this file then run: enclave init

name: my-app                     # App name (used in stack name, EIF name)
version: 0.0.1                   # Build version (semver, baked into binary via ldflags)
region: us-east-1                # AWS region
account: ""                      # AWS account ID (required)
prefix: dev                      # Deployment prefix (stack = {prefix}Nitro{Name})
instance_type: m6i.xlarge        # EC2 instance type
nix_image: nixos/nix:2.24.9      # Docker image for reproducible builds

# SDK coordinates for the enclave supervisor binary.
# The supervisor handles attestation, secrets, PCR extension, and signing
# middleware automatically. Your app is a plain HTTP server with zero SDK imports.
sdk:
  rev: "v0.0.46"
  hash: "sha256-pfLExw13IPq3kvcU3A5qJ4dLgSrmnjgXjWADjlTTgkI="
  vendor_hash: "sha256-pn7BpRe6csX8LnK5NEGXktC+RkoaKg/ZZpJ6SLcP1dE="

app:
  language: "go"
  source: nix

  nix_owner: "ArkLabsHQ"
  nix_repo: "introspector-enclave"
  nix_rev: "33e541fa4112ecdb50f5719024b4dbaea72f5d8c"
  nix_hash: "sha256-+1+s3QDpRDJZXieH+TOA8CrOQ0k5ty4PnvHm7qTcK34="
  nix_vendor_hash: "sha256-mGKxBRU5TPgdmiSx0DHEd0Ys8gsVD/YdBfbDdSVpC3U="
  nix_sub_packages:
    - "cmd"
  binary_name: "test-app"

  # Route AWS traffic through viproxy → vsock → host vsock-proxy → mock services.
  # This bypasses gvproxy TAP (outbound NAT broken in QEMU nitro-enclave).
  env:
    # viproxy mappings: local TCP → vsock CID 3 (forwarded to host by vhost-device-vsock)
    ENCLAVE_VIPROXY_IN_ADDRS: "127.0.0.1:80,127.0.0.1:4566,127.0.0.1:4000"
    ENCLAVE_VIPROXY_OUT_ADDRS: "3:8002,3:8003,3:8004"
    # IMDS via viproxy (port 80 → vsock:8002 → mock-imds:1338)
    IMDS_ENDPOINT: "127.0.0.1"
    # AWS endpoints via viproxy (port 4566 → vsock:8003 → localstack:4566)
    AWS_ENDPOINT_URL_KMS: "http://127.0.0.1:4000"
    ENCLAVE_KMS_KEY_ID: "arn:aws:kms:us-east-1:123456789012:key/test-key-id"
    AWS_ENDPOINT_URL_SSM: "http://127.0.0.1:4566"
    AWS_ENDPOINT_URL_STS: "http://127.0.0.1:4566"
    AWS_ENDPOINT_URL_S3: "http://127.0.0.1:4566"

# No secrets for the skeleton app — keeps the test simple.
# The supervisor will still init KMS/SSM, just with no secret decryption.
secrets: []
