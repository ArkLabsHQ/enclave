name: Integration Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  integration-test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up KVM
        run: sudo chmod 666 /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run integration test
        run: nix build .#checks.x86_64-linux.e2e --print-build-logs
