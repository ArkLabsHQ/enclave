name: Upgrade Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up KVM
        run: sudo chmod 666 /dev/kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Blue runs the runtime of flake.nix's previous-release input, green this revision's.
      - name: Run upgrade test
        run: nix build .#checks.x86_64-linux.e2e-upgrade --print-build-logs
