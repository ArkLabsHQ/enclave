global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "enclave-mgmt"
    scheme: http
    static_configs:
      - targets: ["127.0.0.1:8444"]
    metrics_path: /metrics

  - job_name: "enclave-supervisor"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["127.0.0.1:8443"]
    metrics_path: /v1/metrics
