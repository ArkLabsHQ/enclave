name: CLI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cli-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            app_dir: test/cli/go-app
            commit1: "66c6883"
            commit1_full: "66c6883d60cbc7e04224a9bc149bb182c93c9e53"
            commit1_hash: "sha256-OhBGQoAdqjAEtR6SghBR4tbkrsjmH5I5T+U19chXHRA="
            commit2: "0782325"
            commit2_full: "078232572efba4f95543d0c7c84c0f47a3782955"
            commit2_hash: "sha256-xuWFL/Lr4vi8n/A61bhyAfa+HrwJvLFrgt0rFEWBFcw="
          - language: nodejs
            app_dir: test/cli/nodejs-app
            commit1: "66c6883"
            commit1_full: "66c6883d60cbc7e04224a9bc149bb182c93c9e53"
            commit1_hash: "sha256-OhBGQoAdqjAEtR6SghBR4tbkrsjmH5I5T+U19chXHRA="
            commit2: "0782325"
            commit2_full: "078232572efba4f95543d0c7c84c0f47a3782955"
            commit2_hash: "sha256-xuWFL/Lr4vi8n/A61bhyAfa+HrwJvLFrgt0rFEWBFcw="
          - language: rust
            app_dir: test/cli/rust-app
            commit1: "66c6883"
            commit1_full: "66c6883d60cbc7e04224a9bc149bb182c93c9e53"
            commit1_hash: "sha256-OhBGQoAdqjAEtR6SghBR4tbkrsjmH5I5T+U19chXHRA="
            commit2: "0782325"
            commit2_full: "078232572efba4f95543d0c7c84c0f47a3782955"
            commit2_hash: "sha256-xuWFL/Lr4vi8n/A61bhyAfa+HrwJvLFrgt0rFEWBFcw="
          - language: dotnet
            app_dir: test/cli/dotnet-app
            binary_name: "CliTestApp"
            commit1: "66c6883"
            commit1_full: "66c6883d60cbc7e04224a9bc149bb182c93c9e53"
            commit1_hash: "sha256-OhBGQoAdqjAEtR6SghBR4tbkrsjmH5I5T+U19chXHRA="
            commit2: "0782325"
            commit2_full: "078232572efba4f95543d0c7c84c0f47a3782955"
            commit2_hash: "sha256-xuWFL/Lr4vi8n/A61bhyAfa+HrwJvLFrgt0rFEWBFcw="
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build enclave CLI
        run: go build -o /tmp/enclave-cli ./cmd/enclave

      # ── 1. enclave init ───────────────────────────────────────────
      - name: "enclave init --language ${{ matrix.language }}"
        run: |
          set -e
          WORK=$(mktemp -d)
          cp -r ${{ matrix.app_dir }}/. "$WORK/"
          cd "$WORK"

          # Init a git repo (setup needs git remote).
          git init
          git remote add origin https://github.com/ArkLabsHQ/introspector-enclave.git
          git add .
          git -c user.email=ci@test -c user.name=CI commit -m "init"

          /tmp/enclave-cli init --language ${{ matrix.language }}

          # Verify key files.
          test -f enclave/enclave.yaml
          test -f flake.nix
          test -f enclave/start.sh
          test -f enclave/scripts/enclave_init.sh
          test -f enclave/tofu/modules/enclave/kms.tf
          grep -q '/dev/nsm' enclave/start.sh
          grep -q 'when    = destroy' enclave/tofu/modules/enclave/kms.tf

          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "PASS: enclave init --language ${{ matrix.language }}"

      # ── 2. enclave setup ──────────────────────────────────────────
      - name: "enclave setup --commit ${{ matrix.commit1 }}"
        run: |
          set -e
          cd "$WORK"

          # Set nix_subdir so the flake builds from the app subdirectory.
          sed -i 's/nix_subdir: ""/nix_subdir: "test\/cli\/${{ matrix.language }}-app"/' enclave/enclave.yaml

          # Set binary_name if specified (e.g. dotnet projects have a fixed output name).
          if [ -n "${{ matrix.binary_name }}" ]; then
            sed -i 's/binary_name: ""/binary_name: "${{ matrix.binary_name }}"/' enclave/enclave.yaml
          fi

          git add .
          git -c user.email=ci@test -c user.name=CI commit -m "add enclave files"
          git fetch origin master

          /tmp/enclave-cli setup --commit ${{ matrix.commit1 }}

          # Verify nix_rev is the full SHA.
          grep -q '${{ matrix.commit1_full }}' enclave/enclave.yaml || { echo "FAIL: nix_rev != ${{ matrix.commit1_full }}"; exit 1; }

          # Verify nix_hash matches precomputed value.
          grep -q '${{ matrix.commit1_hash }}' enclave/enclave.yaml || { echo "FAIL: nix_hash != ${{ matrix.commit1_hash }}"; exit 1; }

          # Verify owner/repo.
          grep -q 'nix_owner: "ArkLabsHQ"' enclave/enclave.yaml
          grep -q 'nix_repo: "introspector-enclave"' enclave/enclave.yaml

          # Verify nix_vendor_hash is non-empty (setup computed it from the flake).
          # The exact value depends on the flake.lock nixpkgs pin — the real
          # verification is that `enclave build` accepts it (tested in step 3).
          VENDOR_HASH=$(grep 'nix_vendor_hash:' enclave/enclave.yaml | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          if [ -n "$VENDOR_HASH" ] && [ "$VENDOR_HASH" != "" ]; then
            echo "nix_vendor_hash computed: $VENDOR_HASH"
          else
            echo "WARNING: nix_vendor_hash is empty (setup may have failed to compute it)"
          fi

          echo "PASS: enclave setup (nix_rev=${{ matrix.commit1_full }}, nix_hash=${{ matrix.commit1_hash }})"

      # ── 3. enclave build ──────────────────────────────────────────
      - name: "enclave build"
        run: |
          set -e
          cd "$WORK"

          git add .
          git -c user.email=ci@test -c user.name=CI commit -m "pre-build" || true

          /tmp/enclave-cli build

          # Verify artifacts.
          test -f enclave/artifacts/image.eif || { echo "FAIL: image.eif missing"; exit 1; }
          test -f enclave/artifacts/pcr.json || { echo "FAIL: pcr.json missing"; exit 1; }
          jq -e '.PCR0' enclave/artifacts/pcr.json >/dev/null || { echo "FAIL: PCR0 missing"; exit 1; }
          test -f enclave/artifacts/enclave-mgmt || { echo "FAIL: enclave-mgmt missing"; exit 1; }
          test -f enclave/artifacts/gvproxy || { echo "FAIL: gvproxy missing"; exit 1; }

          echo "PASS: enclave build (artifacts verified)"

      # ── 4. enclave update ─────────────────────────────────────────
      - name: "enclave update --commit ${{ matrix.commit2 }}"
        run: |
          set -e
          cd "$WORK"

          /tmp/enclave-cli update --commit ${{ matrix.commit2 }}

          # Verify nix_rev updated to commit2 full SHA.
          grep -q '${{ matrix.commit2_full }}' enclave/enclave.yaml || { echo "FAIL: nix_rev != ${{ matrix.commit2_full }}"; exit 1; }

          # Verify nix_hash matches precomputed value for commit2.
          grep -q '${{ matrix.commit2_hash }}' enclave/enclave.yaml || { echo "FAIL: nix_hash != ${{ matrix.commit2_hash }}"; exit 1; }

          # Verify hash actually changed between commits.
          if [ "${{ matrix.commit1_hash }}" = "${{ matrix.commit2_hash }}" ]; then
            echo "ERROR: commit1 and commit2 should produce different hashes"
            exit 1
          fi

          echo "PASS: enclave update (nix_rev=${{ matrix.commit2_full }}, nix_hash=${{ matrix.commit2_hash }})"
