name: Integration Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  enclave-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up KVM
        run: sudo chmod 666 /dev/kvm

      - name: Load vsock kernel modules
        run: |
          sudo modprobe vsock
          sudo modprobe vsock_loopback
          test -e /dev/vsock

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build test EIFs
        run: |
          go build -o /tmp/enclave-cli ./cmd/enclave
          cd test/app
          /tmp/enclave-cli build --local
          sed -i 's/^version: .*/version: 0.0.2/' enclave/enclave.yaml
          /tmp/enclave-cli build --local
          cp enclave/artifacts/image.eif enclave/artifacts/image-v2.eif
          cp enclave/artifacts/pcr.json enclave/artifacts/pcr-v2.json
          sed -i 's/^version: .*/version: 0.0.1/' enclave/enclave.yaml
          /tmp/enclave-cli build --local

      - name: Run integration test
        run: cd test && docker compose --profile test run --build test-runner
        env:
          BOOT_TIMEOUT: "120"
          INIT_TIMEOUT: "300"
