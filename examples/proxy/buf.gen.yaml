version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ArkLabsHQ/enclave/examples/proxy/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
  # Node runs the generated .ts directly, so imports keep the .ts extension.
  - local: protoc-gen-es
    out: ts/gen
    opt:
      - target=ts
      - import_extension=ts
