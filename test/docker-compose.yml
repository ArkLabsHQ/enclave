services:
  local-kms:
    image: nsmithuk/local-kms
    ports:
      - "8080:8080"
    environment:
      KMS_REGION: us-east-1
      KMS_ACCOUNT_ID: "123456789012"
    volumes:
      - ./seed.yaml:/init/seed.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  kms-proxy:
    build:
      context: ../
      dockerfile: cmd/local-kms-proxy/Dockerfile
    ports:
      - "4000:4000"
    environment:
      UPSTREAM_KMS_URL: "http://local-kms:8080"
      LISTEN_ADDR: ":4000"
    depends_on:
      local-kms:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: ssm,sts,s3,cloudformation,iam
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-imds:
    build:
      context: ../
      dockerfile: cmd/mock-imds/Dockerfile
    ports:
      - "1338:1338"
    environment:
      LISTEN_ADDR: ":1338"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1338/latest/api/token || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Host-side management server (replicates EC2 host mgmt in test).
  # Uses host networking to reach the QEMU enclave on localhost:8443.
  enclave-mgmt:
    build:
      context: ../
      dockerfile: test/Dockerfile.mgmt
    network_mode: host
    environment:
      ENCLAVE_AWS_REGION: us-east-1
      ENCLAVE_DEPLOYMENT: dev
      ENCLAVE_APP_NAME: my-app
      ENCLAVE_MGMT_ADDR: "127.0.0.1:8444"
      ENCLAVE_TEST_MODE: "1"
      ENCLAVE_URL: "https://127.0.0.1:8443"
      AWS_ENDPOINT_URL_KMS: "http://127.0.0.1:4000"
      AWS_ENDPOINT_URL_SSM: "http://127.0.0.1:4566"
      AWS_ENDPOINT_URL_STS: "http://127.0.0.1:4566"
      AWS_ENDPOINT_URL_S3: "http://127.0.0.1:4566"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
      kms-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8444/health || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Full QEMU enclave test runner (replaces nix develop).
  # Usage: docker compose --profile test run --build test-runner
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.runner
    privileged: true
    network_mode: host
    volumes:
      - .:/test
    depends_on:
      localstack:
        condition: service_healthy
      mock-imds:
        condition: service_healthy
      kms-proxy:
        condition: service_healthy
    environment:
      SKIP_MOCK_SERVICES: "1"
      # Must match enclave.yaml name — the SDK reads ENCLAVE_APP_NAME for SSM paths.
      ENCLAVE_APP_NAME: "test-app"
    command: ["./run.sh", "app/enclave/artifacts/image.eif"]
