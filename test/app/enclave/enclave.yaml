# Enclave configuration
# Edit this file then run: enclave init

name: my-app                     # App name (used in stack name, EIF name)
version: 0.0.1
region: us-east-1                # AWS region
account: "000000000000"                      # AWS account ID (required)
prefix: dev                      # Deployment prefix (stack = {prefix}Nitro{Name})
instance_type: m6i.xlarge        # EC2 instance type
nix_image: nixos/nix:2.24.9      # Docker image for reproducible builds
migration_cooldown: "1m"         # Cooldown before migration proceeds (for testing)

# Runtime coordinates for the enclave supervisor binary.
# The supervisor handles attestation, secrets, PCR extension, and signing
# middleware automatically. Your app is a plain HTTP server with zero runtime imports.
runtime:
  rev: "v0.0.62"
  hash: "sha256-xa7ukVvTTXqHn7L4MOwVv+L8N20vO8MKiXrbj4Mvhjo="
  vendor_hash: "sha256-nj/KWLaYuxV67ytwoX5YnnWlGzsTKrm8TL7EpLPAC40="

app:
  language: "go"
  source: nix

  nix_owner: "ArkLabsHQ"
  nix_repo: "introspector-enclave"
  nix_rev: "01e1caa74a01d2ce1b0b322f1ccc3fbd2450c69d"
  nix_hash: "sha256-KytvlwE+91TmHeQmo7E2PdwLfNZN6jTE++VSRVwiiPM="
  nix_vendor_hash: "sha256-hB3FY2TTv1t7udonVKaWboXbA+x1JOv1ZeCfCzNRNC4="
  nix_sub_packages:
    - "cmd"
  binary_name: "test-app"
  release_tag: "eif-latest"

  env:
    # AWS services through gvproxy TAP via host.containers.internal (matches production path).
    # IMDS uses viproxy by default (127.0.0.1:80 → vsock 3:8002) — no override needed.
    AWS_ENDPOINT_URL_KMS: "http://host.containers.internal:4000"
    AWS_ENDPOINT_URL_SSM: "http://host.containers.internal:4566"
    AWS_ENDPOINT_URL_STS: "http://host.containers.internal:4566"
    AWS_ENDPOINT_URL_S3: "http://host.containers.internal:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    ENCLAVE_LOG_CLOUDWATCH: "true"
    AWS_ENDPOINT_URL_LOGS: "http://host.containers.internal:4566"

# One secret for testing KMS secret init and migration.
secrets:
  - name: signing_key
    env_var: SIGNING_KEY













