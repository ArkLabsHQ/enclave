name: Lint & Vet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet (root)
        run: go vet ./...

      - name: Go vet (runtime)
        run: cd runtime && go vet ./...

      - name: Go vet (supervisor)
        run: cd supervisor && go vet ./...

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: .

      - name: golangci-lint (runtime)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: runtime

      - name: golangci-lint (supervisor)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: supervisor
