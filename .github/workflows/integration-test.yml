name: Integration Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  enclave-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up KVM
        run: sudo chmod 666 /dev/kvm

      - name: Load vsock kernel modules
        run: |
          sudo modprobe vsock
          sudo modprobe vsock_loopback
          test -e /dev/vsock

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build test EIFs
        run: |
          go build -o /tmp/enclave-cli ./cmd/enclave
          export SDK_LOCAL_PATH=$GITHUB_WORKSPACE
          export MGMT_LOCAL_PATH=$GITHUB_WORKSPACE

          # Vendor SDK dependencies (vendor/ is gitignored, Nix needs it when using local source).
          cd $SDK_LOCAL_PATH/sdk && go mod vendor && cd $GITHUB_WORKSPACE/test/app

          # Build v1 EIF.
          /tmp/enclave-cli build
          cp enclave/artifacts/pcr.json /tmp/pcr-v1.json
          V1_PCR0=$(jq -r '.PCR0' enclave/artifacts/pcr.json)

          # Build v2 EIF with previous_pcr0 set to v1's PCR0.
          sed -i 's/^version: .*/version: 0.0.2/' enclave/enclave.yaml
          echo "" >> enclave/enclave.yaml
          echo "previous_pcr0: \"${V1_PCR0}\"" >> enclave/enclave.yaml
          /tmp/enclave-cli build
          cp enclave/artifacts/image.eif /tmp/image-v2.eif
          cp enclave/artifacts/pcr.json /tmp/pcr-v2.json

          # Restore v1 as the active EIF.
          sed -i 's/^version: .*/version: 0.0.1/' enclave/enclave.yaml
          sed -i '/^previous_pcr0:/d' enclave/enclave.yaml
          /tmp/enclave-cli build

          # Copy v1/v2 artifacts back (enclave build wipes artifacts/ each time).
          cp /tmp/pcr-v1.json enclave/artifacts/pcr-v1.json
          cp /tmp/image-v2.eif enclave/artifacts/image-v2.eif
          cp /tmp/pcr-v2.json enclave/artifacts/pcr-v2.json

      - name: Run integration test
        run: cd test && docker compose --profile test run --build test-runner
        env:
          BOOT_TIMEOUT: "120"
          INIT_TIMEOUT: "300"
