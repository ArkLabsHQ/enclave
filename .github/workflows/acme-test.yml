name: ACME Integration Test

# End-to-end test of the enclave's Let's Encrypt / ACME support: boots the
# test enclave against a local Pebble ACME server and verifies it obtains a
# cert via TLS-ALPN-01 and reuses it across a reboot. Mirrors `make test-acme`
# (see test/acme-test.sh).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  acme-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up KVM
        run: sudo chmod 666 /dev/kvm

      - name: Load vsock kernel modules
        run: |
          sudo modprobe vsock
          sudo modprobe vsock_loopback
          test -e /dev/vsock

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build test EIF
        run: |
          go build -o /tmp/enclave-cli ./cli/cmd/enclave
          # Build the runtime + app from this checkout's tree (mirrors
          # `make test-build`) so the ACME test exercises the working tree,
          # not a pinned release. The ACME test is SSM-driven and needs only
          # the v1 EIF — no v2/v3 migration variants.
          export RUNTIME_LOCAL_PATH=$GITHUB_WORKSPACE
          export SUPERVISOR_LOCAL_PATH=$GITHUB_WORKSPACE
          export APP_LOCAL_PATH=$GITHUB_WORKSPACE/test/app
          # vendor/ is gitignored; Nix needs it when building from local source.
          (cd runtime && go mod vendor)
          (cd test/app && go mod vendor && /tmp/enclave-cli build)

      - name: Generate Pebble ACME certificates
        run: bash test/pebble/gen-certs.sh

      - name: Run ACME integration test
        run: cd test && docker compose --profile acme run --build acme-runner

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acme-test-logs
          path: test/*.log
          if-no-files-found: ignore
