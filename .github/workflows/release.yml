name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version (e.g. v0.0.29)'
        required: true

permissions:
  contents: write

jobs:
  sdk-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate version
        run: |
          TAG="${{ inputs.version }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: ${TAG} (expected vX.Y.Z)"
            exit 1
          fi
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Use a new version number."
            exit 1
          fi

      - name: Compute vendor hash
        id: vendor
        run: |
          cd sdk
          OUTPUT=$(nix build --impure \
            --extra-experimental-features 'nix-command flakes' \
            --expr '
              let pkgs = import <nixpkgs> {};
              in pkgs.buildGoModule {
                pname = "enclave-supervisor";
                version = "dev";
                src = ./.;
                subPackages = ["cmd/enclave-supervisor"];
                vendorHash = "";
                doCheck = false;
              }
            ' 2>&1 || true)
          VENDOR_HASH=$(echo "$OUTPUT" | grep 'got:' | awk '{print $2}')
          if [ -z "$VENDOR_HASH" ]; then
            VENDOR_HASH=$(jq -r '.vendor_hash' ../sdk-hashes.json)
          fi
          echo "vendor_hash=${VENDOR_HASH}" >> "$GITHUB_OUTPUT"
          echo "Vendor hash: ${VENDOR_HASH}"

      - name: Update sdk-hashes.json and commit
        run: |
          TAG="${{ inputs.version }}"
          VENDOR_HASH="${{ steps.vendor.outputs.vendor_hash }}"

          jq -n \
            --arg rev "$TAG" \
            --arg hash "placeholder" \
            --arg vendor_hash "$VENDOR_HASH" \
            '{rev: $rev, hash: $hash, vendor_hash: $vendor_hash}' > sdk-hashes.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk-hashes.json
          git commit -m "sdk hashes for ${TAG}"

      - name: Compute real source hash and finalize
        run: |
          TAG="${{ inputs.version }}"
          VENDOR_HASH="${{ steps.vendor.outputs.vendor_hash }}"

          git tag "$TAG"
          TMPDIR=$(mktemp -d)
          git archive --format=tar.gz --prefix=source/ HEAD | tar xz -C "$TMPDIR"
          SOURCE_HASH=$(nix hash path "$TMPDIR/source")
          rm -rf "$TMPDIR"
          echo "Source hash: ${SOURCE_HASH}"

          jq -n \
            --arg rev "$TAG" \
            --arg hash "$SOURCE_HASH" \
            --arg vendor_hash "$VENDOR_HASH" \
            '{rev: $rev, hash: $hash, vendor_hash: $vendor_hash}' > sdk-hashes.json

          git add sdk-hashes.json
          git commit --amend --no-edit
          git tag -f "$TAG"

          echo "Final sdk-hashes.json:"
          cat sdk-hashes.json

      - name: Push commit and tag
        run: |
          TAG="${{ inputs.version }}"
          git push origin HEAD:master
          git push origin "refs/tags/${TAG}"
          echo "Pushed ${TAG}"

      - name: Verify build
        run: |
          cd sdk
          VENDOR_HASH=$(jq -r '.vendor_hash' ../sdk-hashes.json)
          nix build --impure \
            --extra-experimental-features 'nix-command flakes' \
            --expr "
              let pkgs = import <nixpkgs> {};
              in pkgs.buildGoModule {
                pname = \"enclave-supervisor\";
                version = \"${{ inputs.version }}\";
                src = ./.;
                subPackages = [\"cmd/enclave-supervisor\"];
                vendorHash = \"${VENDOR_HASH}\";
                tags = [\"netgo\"];
                doCheck = false;
              }
            "
          echo "enclave-supervisor built successfully."

  build-cli:
    needs: sdk-hashes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          MODULE=github.com/ArkLabsHQ/introspector-enclave
          HASHES_FILE=sdk-hashes.json

          SDK_REV=$(jq -r '.rev' "$HASHES_FILE" 2>/dev/null || echo "")
          SDK_HASH=$(jq -r '.hash' "$HASHES_FILE" 2>/dev/null || echo "")
          SDK_VENDOR_HASH=$(jq -r '.vendor_hash' "$HASHES_FILE" 2>/dev/null || echo "")

          LDFLAGS="-X ${MODULE}.sdkRev=${SDK_REV} -X ${MODULE}.sdkHash=${SDK_HASH} -X ${MODULE}.sdkVendorHash=${SDK_VENDOR_HASH}"

          OUTPUT="enclave-cli-${GOOS}-${GOARCH}"
          go build -ldflags "${LDFLAGS}" -o "${OUTPUT}" ./cmd/enclave
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: enclave-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            enclave-cli-${{ matrix.goos }}-${{ matrix.goarch }}
            enclave-cli-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  create-release:
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
          files: artifacts/*
