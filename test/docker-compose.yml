services:
  local-kms:
    image: nsmithuk/local-kms
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KMS_REGION: us-east-1
      KMS_ACCOUNT_ID: "123456789012"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Combined helper: kms-proxy (:4000) + mock-imds (:1338) in one container.
  # Source lives at the repo root in awsmocks/. Published as
  # ghcr.io/arklabshq/enclave-awsmocks for upstream apps; the framework's
  # self-test builds it locally from source.
  aws-mocks:
    build:
      context: ../awsmocks
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:1338:1338"
    environment:
      UPSTREAM_KMS_URL: "http://local-kms:8080"
      KMS_PROXY_LISTEN_ADDR: ":4000"
      IMDS_LISTEN_ADDR: ":1338"
    depends_on:
      local-kms:
        condition: service_healthy
    healthcheck:
      # Healthy only when BOTH listeners answer their /health route.
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health && wget -qO- http://localhost:1338/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:4.14
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: ssm,sts,s3,cloudformation,iam,logs,route53,ec2,dynamodb
      LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full QEMU enclave test runner (replaces nix develop).
  # Usage: docker compose --profile test run --build test-runner
  test-runner:
    profiles: ["test"]
    build:
      context: ../
      dockerfile: test/Dockerfile.runner
    privileged: true
    network_mode: host
    volumes:
      - .:/test
    depends_on:
      localstack:
        condition: service_healthy
      aws-mocks:
        condition: service_healthy
    environment:
      SKIP_MOCK_SERVICES: "1"
      # Must match enclave.yaml name — the runtime reads ENCLAVE_APP_NAME for SSM paths.
      ENCLAVE_APP_NAME: "test-app"
    command: ["./run.sh", "app/.enclave/artifacts/image.eif"]

  # Pebble — Let's Encrypt's test ACME server, for the end-to-end ACME test
  # (acme-test.sh). Only started under the "acme" compose profile. Host
  # network (like acme-runner): the challenge target enclave.test resolves to
  # 127.0.0.1, where the supervisor's gvproxy forwards 8443 -> enclave:443.
  # Loopback keeps the VA dial exempt from host firewalls (NixOS/ufw drop
  # bridge->host traffic, which stalls TLS-ALPN-01 validation forever) and
  # avoids relying on Docker's host-gateway mapping. The enclave reaches
  # Pebble unchanged: host.containers.internal:14000 -> gvproxy NAT ->
  # 127.0.0.1:14000.
  pebble:
    profiles: ["acme"]
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/test/pebble/pebble-config.json", "-strict"]
    network_mode: host
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./pebble:/test/pebble:ro
    extra_hosts:
      - "enclave.test:127.0.0.1"

  # Runs the end-to-end ACME test (acme-test.sh) — mirrors test-runner.
  acme-runner:
    profiles: ["acme"]
    build:
      context: ../
      dockerfile: test/Dockerfile.runner
    privileged: true
    network_mode: host
    volumes:
      - .:/test
    depends_on:
      localstack:
        condition: service_healthy
      aws-mocks:
        condition: service_healthy
      pebble:
        condition: service_started
    environment:
      SKIP_MOCK_SERVICES: "1"
      # Must match enclave.yaml `name` — the runtime + tofu derive SSM paths from it.
      ENCLAVE_APP_NAME: "my-app"
      ENCLAVE_DEPLOYMENT: "dev"
    command: ["./acme-test.sh", "app/.enclave/artifacts/image.eif"]
