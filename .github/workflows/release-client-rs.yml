name: Release Rust Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version (e.g. v0.0.29)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" client-rs/Cargo.toml
          echo "Version set to ${VERSION}"

      - name: Build
        run: cargo build --release -p enclave-client

      - name: Test
        run: cargo test -p enclave-client
