name: EIF publish

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name. Selects the eif-<environment> artifact from this run.
        type: string
        required: true
      app_name:
        description: S3 key prefix. Must match the app_name given to eif-build.
        type: string
        required: true
      bucket:
        description: Destination bucket name.
        type: string
        required: true
      region:
        description: AWS region of the bucket.
        type: string
        required: true
    secrets:
      role_arn:
        description: "ARN of the role to assume by OIDC. One role, declared explicitly, never secrets: inherit."
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: publish (${{ inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      # No checkout: this job never needs source, only the built artefact.
      - uses: actions/download-artifact@v8
        with:
          name: eif-${{ inputs.environment }}
          path: eif

      # Trusting an artefact rather than rebuilding is worth minutes on a runner with a
      # cold /nix/store. The checksums are what make that safe, and they are verified
      # before any credential is requested.
      - name: Verify checksums
        working-directory: eif
        run: sha256sum -c SHA256SUMS

      # An unset secret resolves to an empty string, which configure-aws-credentials
      # reports as a malformed ARN. That reads like a broken workflow rather than a
      # missing secret, so name the real problem first.
      - name: Check the publish role is configured
        env:
          ROLE_ARN: ${{ secrets.role_arn }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::the caller passed an empty role_arn secret"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.role_arn }}
          aws-region: ${{ inputs.region }}

      - name: Publish to S3
        working-directory: eif
        env:
          BUCKET: ${{ inputs.bucket }}
          APP_NAME: ${{ inputs.app_name }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          pcr0="$(jq -r .PCR0 ./*.pcr.json)"
          eif="$(ls ./*.eif)"
          pcr="$(ls ./*.pcr.json)"
          sha="$(sha256sum "$eif" | cut -d' ' -f1)"
          key="${APP_NAME}/${pcr0}.eif"
          pcr_key="${APP_NAME}/${pcr0}.pcr.json"

          # The object name is the measurement, so the same source always writes the
          # same name and re-running is expected to be a no-op.
          #
          # The digest travels as user metadata rather than being read back from S3's
          # own checksum: aws s3 cp uploads a large file as multipart, so the native
          # checksum is a composite of part digests, not the digest of the file.
          #
          # A missing key must be told apart from a failed lookup. Swallowing every
          # error would let a throttled or not-yet-propagated call look like "not
          # published" and overwrite a differing measurement, which is the one thing
          # this check exists to prevent. S3 answers 404 for a missing key only when
          # the caller holds s3:ListBucket; without it every miss is a 403 and the two
          # cannot be told apart. ark-infra's modules/github-oidc grants it for this.
          set +e
          existing="$(aws s3api head-object --bucket "$BUCKET" --key "$key" \
            --query 'Metadata.sha256' --output text 2>"$RUNNER_TEMP/head-object.err")"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            present=true
          elif grep -q '(404)' "$RUNNER_TEMP/head-object.err"; then
            present=false
          else
            echo "::error::head-object on ${key} failed for an unexpected reason"
            cat "$RUNNER_TEMP/head-object.err"
            exit 1
          fi

          if [ "$present" = true ]; then
            if [ "$existing" = "$sha" ]; then
              status="Already published"
            elif [ "$existing" = "None" ]; then
              echo "::error::${key} exists but carries no sha256 metadata; refusing to overwrite it"
              exit 1
            else
              echo "::error::${key} exists with sha256 ${existing}, built ${sha}"
              exit 1
            fi
          else
            # Push the measurement goes first, ensuring the pair is published together, even if the EIF
            # isn't overwritten.
            aws s3 cp "$pcr" "s3://${BUCKET}/${pcr_key}"
            aws s3 cp "$eif" "s3://${BUCKET}/${key}" --metadata "sha256=${sha}"
            status="Published"
          fi

          # The three fields ark-infra's modules/enclave refuses a slot without.
          # Printed on both paths: a no-op re-run is the common case, and the operator
          # needs these values exactly as much then.
          {
            echo "## ${status}: ${APP_NAME} / ${ENV_NAME}"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| eif_s3_uri | \`s3://${BUCKET}/${key}\` |"
            echo "| eif_pcr0 | \`${pcr0}\` |"
            echo "| eif_sha256 | \`${sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
