name: Integration Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  enclave-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up KVM
        run: sudo chmod 666 /dev/kvm

      - name: Load vsock kernel modules
        run: |
          sudo modprobe vsock
          sudo modprobe vsock_loopback
          test -e /dev/vsock

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build test EIFs
        run: |
          go build -o /tmp/enclave-cli ./cli/cmd/enclave
          export RUNTIME_LOCAL_PATH=$GITHUB_WORKSPACE
          export SUPERVISOR_LOCAL_PATH=$GITHUB_WORKSPACE
          # Build the test app from the workspace tree (mirrors `make test-build`)
          # so the baked nix_rev/nix_hash in test/app/enclave/enclave.yaml don't
          # need to be re-pinned on every change to test/app/.
          export APP_LOCAL_PATH=$GITHUB_WORKSPACE/test/app

          # Vendor SDK dependencies (vendor/ is gitignored, Nix needs it when using local source).
          cd $RUNTIME_LOCAL_PATH/runtime && go mod vendor && cd $GITHUB_WORKSPACE/test/app
          go mod vendor

          # Preserve the checked fixture exactly; variants are temporary build inputs.
          cp enclave/enclave.yaml /tmp/enclave.yaml.original
          trap 'cp /tmp/enclave.yaml.original enclave/enclave.yaml' EXIT

          # v1 is the source and keeps the fixture's short nonzero cooldown.
          /tmp/enclave-cli build
          cp .enclave/artifacts/image.eif /tmp/image-v1.eif
          cp .enclave/artifacts/pcr.json /tmp/pcr-v1.json
          V1_PCR0=$(jq -r '.PCR0' /tmp/pcr-v1.json)

          # v2 is healthy and bakes zero cooldown for the v2 -> v3 flow.
          sed -i 's/^version: .*/version: 0.0.2/' enclave/enclave.yaml
          sed -i 's/^migration_cooldown: .*/migration_cooldown: "0s"/' enclave/enclave.yaml
          if grep -q '^previous_pcr0:' enclave/enclave.yaml; then
            sed -i "s/^previous_pcr0: .*/previous_pcr0: \"${V1_PCR0}\"/" enclave/enclave.yaml
          else
            echo "" >> enclave/enclave.yaml
            echo "previous_pcr0: \"${V1_PCR0}\"" >> enclave/enclave.yaml
          fi
          /tmp/enclave-cli build
          cp .enclave/artifacts/image.eif /tmp/image-v2.eif
          cp .enclave/artifacts/pcr.json /tmp/pcr-v2.json

          # v3 is another healthy zero-cooldown successor.
          V2_PCR0=$(jq -r '.PCR0' /tmp/pcr-v2.json)
          sed -i 's/^version: .*/version: 0.0.3/' enclave/enclave.yaml
          sed -i "s|^previous_pcr0: .*|previous_pcr0: \"${V2_PCR0}\"|" enclave/enclave.yaml
          /tmp/enclave-cli build
          cp .enclave/artifacts/image.eif /tmp/image-v3.eif
          cp .enclave/artifacts/pcr.json /tmp/pcr-v3.json

          # v4 has the wrong app name, so readiness fails and restores v3.
          V3_PCR0=$(jq -r '.PCR0' /tmp/pcr-v3.json)
          sed -i 's/^version: .*/version: 0.0.4/' enclave/enclave.yaml
          sed -i "s|^previous_pcr0: .*|previous_pcr0: \"${V3_PCR0}\"|" enclave/enclave.yaml
          sed -i 's|^name: my-app\b|name: my-app-wrong|' enclave/enclave.yaml
          /tmp/enclave-cli build
          cp .enclave/artifacts/image.eif /tmp/image-v4.eif
          cp .enclave/artifacts/pcr.json /tmp/pcr-v4.json

          cp /tmp/enclave.yaml.original enclave/enclave.yaml
          trap - EXIT

          # Install all artifacts from /tmp.
          cp /tmp/image-v1.eif .enclave/artifacts/image.eif
          cp /tmp/pcr-v1.json .enclave/artifacts/pcr.json
          cp /tmp/image-v1.eif .enclave/artifacts/image-v1.eif
          cp /tmp/pcr-v1.json .enclave/artifacts/pcr-v1.json
          cp /tmp/image-v2.eif .enclave/artifacts/image-v2.eif
          cp /tmp/pcr-v2.json .enclave/artifacts/pcr-v2.json
          cp /tmp/image-v3.eif .enclave/artifacts/image-v3.eif
          cp /tmp/pcr-v3.json .enclave/artifacts/pcr-v3.json
          cp /tmp/image-v4.eif .enclave/artifacts/image-v4.eif
          cp /tmp/pcr-v4.json .enclave/artifacts/pcr-v4.json

      - name: Run integration test
        run: cd test && docker compose --profile test run --build test-runner
        env:
          BOOT_TIMEOUT: "120"
          INIT_TIMEOUT: "300"
